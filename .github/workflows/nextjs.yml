
name: Publicar Camada no GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Compilar o Next.js
        working-directory: frontend
        run: npm run build
        
      - name: Verificar arquivos CSS
        working-directory: frontend
        run: |
          echo "Repositório: $GITHUB_REPOSITORY"
          echo "GitHub Actions: $GITHUB_ACTIONS"
          echo "Arquivos CSS:"
          find out/_next/static -name "*.css"
          echo "Referências no HTML:"
          grep -oE 'href="[^"]+\.css[^"]*"' out/index.html

      - name: Enviar arquivos estáticos
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
